# Arm the SoC watchdog (qcom_wdt, "qcom,kpss-wdt") while the system runs and
# during reboot. A kernel freeze (seen at the start of shutdown, panel
# re-init) otherwise leaves a black screen until a forced power cycle.
#
# qcom_wdt counts 0xFFFFF ticks of the 32 kHz sleep clock, so it holds at
# most about 32 s; systemd's default RebootWatchdogSec=10min is rejected with
# EINVAL and no watchdog is armed at all. PID 1 pings every RuntimeWatchdogSec/2.
# The driver stops the watchdog in late suspend, so s2idle is unaffected.
[Manager]
RuntimeWatchdogSec=20s
RebootWatchdogSec=30s
