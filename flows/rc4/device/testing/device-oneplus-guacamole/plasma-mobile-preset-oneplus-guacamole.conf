# Plasma Mobile device preset for the OnePlus 7 Pro (guacamole).
# Installed as /usr/share/plasma-mobile-device-presets/oneplus,guacamole.conf
# and qcom,sm8150-mtp.conf (the ABL wrapper DTB's root compatible);
# plasma-mobile-envmanager picks it from the DT root compatible at login and
# copies it to ~/.config/plasma-mobile/plasmamobilerc [Panels][WhenOn*].
# Spec: plasma-mobile devices/spec.conf. Values are device pixels (the shell
# divides them by the output scale, 3 on this panel).
#
# The 1440x3120 panel has rounded corners. LineageOS masks them with a
# 223x223 px squircle (OPlusSystemUIResTarget/res/drawable/rounded.xml), which
# covers x < 70 px at 21 px from the top edge, where the Plasma clock glyphs
# start. Plasma already pads 36 px (3 * smallSpacing); 36 more gives 72 px.
# The same mask applies to the bottom corners, where the navigation panel's
# corner buttons (rotation, keyboard toggle) sit 21 px from the edges.
#
# [Panels] is the fallback for Top/Bottom/Left/Right, so the status bar and
# the navigation panel get the inset at both ends in every orientation.
# Keep left and right equal: plasma-mobile 6.8.3 StatusBar.qml swaps them.

[Device]
name=OnePlus 7 Pro

[Panels]
leftPadding=36
rightPadding=36
