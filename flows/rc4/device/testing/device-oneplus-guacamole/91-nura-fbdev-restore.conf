# Stop the DRM fbdev console from taking the display back when the
# compositor exits (drm_fb_helper restore on lastclose). At shutdown that
# restore re-initialised the panel at its preferred 90 Hz mode while the
# system was going down, and some of those modesets ended in a silent
# secure-firmware reset (2026-11-23). Set after boot: /dev/fb0 and the
# initramfs splash were already set up, so only the restore and fbdev
# hotplug handling are skipped. If the compositor dies, the screen keeps its
# last frame instead of showing the text console.
w /sys/module/drm_kms_helper/parameters/fbdev_emulation - - - - N
