# rc4j: keep systemd's default log level at info.
#
# The ABL appends a bare "debug" token to the kernel command line after the
# boot image's own cmdline (visible in /proc/cmdline as
# "androidboot.type=sdebug debug ...").  systemd parses that token and raises
# both managers to debug.  A cmdline token from the boot image cannot override
# it because the bootloader's token comes later, and systemd.log_level= in the
# boot image would be parsed first.  pmOS_loglevel=8 is an unknown kernel
# parameter (the kernel prints it in "Unknown kernel command line parameters")
# and does not set the systemd level.
#
# systemd parses this file before it parses /proc/cmdline, but it applies
# ManagerEnvironment= after that parse (setenv_manager_environment() runs
# before the final log_parse_environment()), and DefaultEnvironment= is part
# of the environment of every executed process.  SYSTEMD_LOG_LEVEL=info in
# the manager environment therefore wins over the bootloader's "debug" for
# PID 1, and every system service (including user@.service, and thus the
# user manager and its children) starts with info as well.
#
# This is a rootfs change: no new boot.img is needed.  To collect debug logs
# again, change both "info" values to "debug" in this file, reboot, or use
# `sudo systemctl log-level debug` and `systemctl --user log-level debug` for
# the running managers.  The persistent journal, nura-boot-diagnostics and the
# nura-gpu-crash-capture collector are not touched by this file.

[Manager]
ManagerEnvironment=SYSTEMD_LOG_LEVEL=info
DefaultEnvironment=SYSTEMD_LOG_LEVEL=info
